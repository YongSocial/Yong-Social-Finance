---
layout: default
title: Home
---
{% include watch-section.html %}
{% include category-sections.html %}

<section class="ys-sec">
  <div class="ys-sec-head">
    <h2>LATEST</h2>
    <span class="ys-sec-sub">Everything, most recent first</span>
  </div>
  <div class="ys-grid">
    {% assign latest = site.posts | sort: "date" | reverse | slice: 0, 9 %}
    {% for post in latest %}
      {% include post-card.html post=post %}
    {% endfor %}
  </div>
</section>
