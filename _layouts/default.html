<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport">

<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta name="author" content="{{ site.author }}">
<meta name="publisher" content="{{ site.publisher }}">
<meta name="keywords" content="{{ page.categories | default: page.tags | join: ', ' | default: 'finance news, cryptocurrency, bitcoin, ethereum, investing, stock market, personal finance, wealth building' }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Open Graph -->
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}">
{% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
<meta property="og:locale" content="en_US">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{ site.twitter_handle }}">
<meta name="twitter:creator" content="@{{ site.twitter_handle }}">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}">

{% seo %}
{% feed_meta %}

<!-- Structured data: Organization -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}/",
  "description": "{{ site.description | strip_newlines }}",
  "sameAs": ["{{ site.social.x }}"]
}
</script>

{% if page.layout == 'post' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "image": "{{ page.image | default: site.logo | absolute_url }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": { "@type": "Person", "name": "{{ page.author | default: site.author }}" },
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.title }}",
    "logo": { "@type": "ImageObject", "url": "{{ site.logo | absolute_url }}" }
  },
  "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ page.url | absolute_url }}" }
}
</script>
{% endif %}

<link rel="stylesheet" href="{{ '/assets/css/blogger-base.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
{% if page.custom_css %}<style>{{ page.custom_css }}</style>{% endif %}

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense_client }}" crossorigin="anonymous"></script>
</head>
<body>

{% include ticker.html %}
{% include header.html %}

<main class="page_body">
  {{ content }}
</main>

{% include footer.html %}

<script src="{{ '/assets/js/crypto-ticker.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
