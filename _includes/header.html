<div class="page">
  <header class="blog-name container" style="max-width:1200px;margin:0 auto;padding:20px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
    <a href="{{ '/' | relative_url }}" style="text-decoration:none;color:#0f1115;">
      <h1 style="margin:0;font-size:24px;font-weight:900;letter-spacing:-.02em;">{{ site.title }}</h1>
      <p style="margin:2px 0 0;font-size:12px;color:#6b7280;">{{ site.tagline }}</p>
    </a>

    <nav class="page_list" aria-label="Primary">
      <ul style="list-style:none;display:flex;gap:20px;margin:0;padding:0;flex-wrap:wrap;">
        {% for item in site.nav_pages %}
        <li><a href="{{ item.url | relative_url }}" style="text-decoration:none;color:#1a1d24;font-size:14px;font-weight:600;">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>

    <form action="{{ '/search/' | relative_url }}" method="get" role="search" class="search" style="display:flex;">
      <input type="text" name="q" placeholder="Search" aria-label="Search this site" style="padding:8px 10px;border:1px solid #dcdfe6;border-radius:6px 0 0 6px;font-size:14px;">
      <button type="submit" style="padding:8px 14px;border:0;background:#2563EB;color:#fff;border-radius:0 6px 6px 0;font-weight:600;cursor:pointer;">Go</button>
    </form>
  </header>
</div>
